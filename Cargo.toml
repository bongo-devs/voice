[package]
name = "voice"
version = "0.1.0"
edition = "2021"
description = "Discord voice send layer: paces 20ms Opus frames into DAVE-encrypted RTP over UDP."
license = "MIT"
repository = "https://github.com/bongo-devs/voice"
keywords = ["discord", "voice", "opus", "rtp", "dave"]
categories = ["multimedia::audio", "network-programming"]

[dependencies]
tokio = { version = "1.52", features = ["rt-multi-thread", "sync", "time", "net", "macros"] }
bytes = "1"
tracing = "0.1"
serde_json = "1"
davey = "0.1.3"
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.32"
aes-gcm = "0.10.3"
chacha20poly1305 = "0.10.1"

[dev-dependencies]
tokio = { version = "1.52", features = ["full"] }
